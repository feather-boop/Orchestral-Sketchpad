<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orchestral Sketchpad</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>

html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-user-select:none;user-select:none}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0;font-weight:650;letter-spacing:.02em}
.grp{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
button,select,input[type=number]{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line2);border-radius:8px;min-height:40px;padding:0 12px}
button:active{filter:brightness(.92)}
button.on,button.pri{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
button.pri{font-weight:650;min-width:92px}
input[type=number]{width:64px;padding:0 6px;text-align:center}
label{color:var(--mute);font-size:12px}
#pos{font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px}
main{flex:1;display:flex;min-height:0}
#side{width:228px;flex:none;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
.tr{display:grid;grid-template-columns:12px 1fr 30px 30px 30px;gap:4px 6px;align-items:center;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.tr.sel{background:var(--sel)}
.dot{width:10px;height:10px;border-radius:50%}
.tr .nm{font-weight:600;font-size:14px}
.tr .nm small{color:var(--mute);font-weight:400;margin-left:4px}
.tr button{min-height:30px;padding:0;font-size:12px;border-radius:6px}
.tr input[type=range]{grid-column:2/6;width:100%;margin:0;height:22px}
#sc{flex:1;overflow:auto;position:relative;background:var(--bg)}
#in{position:relative}
#rc{position:sticky;top:0;left:0;display:block}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:88vw;text-align:center}
#toast.show{opacity:.95}
@media (max-width:700px){#side{width:176px}header h1{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
[hidden]{display:none!important}
#menu{position:fixed;inset:0;z-index:15;background:var(--bg);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.mh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.mh h2{margin:0;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:12px;cursor:pointer}
.card.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.cn{font:inherit;font-weight:650;font-size:16px;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1px dashed var(--line2);border-radius:0;padding:4px 0;min-height:36px;color:var(--ink);-webkit-user-select:text;user-select:text}
.cm{color:var(--mute);font-size:13px;margin:8px 0 10px}
.ca{display:flex;gap:6px;flex-wrap:wrap}.ca button{min-height:36px;padding:0 10px}
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:12px}
.box{background:var(--panel);border-radius:14px;max-width:580px;width:100%;max-height:88vh;overflow:auto;padding:16px}
.box h3{margin:0 0 10px;font-size:18px}
.sec{margin:14px 0 6px;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.igrid button{text-align:left;display:flex;gap:8px;align-items:center}
.igrid .dot{display:inline-block;flex:none}
.irow{display:grid;grid-template-columns:1fr minmax(150px,46%);gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.irow small{color:var(--mute);display:block}.irow select{width:100%}

.gh button{min-height:26px;padding:0;font-size:11px;border-radius:6px}
.sw{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.sw button{min-height:34px;padding:0;border-radius:8px}
#lanebar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line)}
#lanebar button{min-height:34px;padding:0 10px;font-size:13px}#lhint{color:var(--mute);font-size:12px}
#lanew{overflow:hidden;height:96px;flex:none;background:var(--bg)}#lc{display:block;touch-action:none}
#act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
#act button{min-height:36px;padding:0 12px}#act button:disabled{opacity:.4}
#act span{color:var(--mute);font-size:13px;margin-right:6px;min-width:96px}
#rec{position:fixed;right:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:12;background:var(--panel);border:2px solid var(--acc);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;box-shadow:0 4px 18px rgba(0,0,0,.3);font-weight:650}
</style>
</head>

    if(old&&old.T&&old.T.length===BASE.length){P=Object.assign({tempo:90,bars:8,grid:.5,bw:40},old.P);T=old.T.map((t,i)=>Object.assign({k:BASE[i].k},t));sync();const id=uid();idx.list.push({id,name:'My arrangement',mod:Date.now()});curId=id;idx.cur=id;saveNow()}

function initAudio(){

  master=ac.createGain();master.gain.value=.8;
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;
  master.connect(comp);comp.connect(ac.destination);

  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}

const WAVES={};let nbuf=null;

function voice(I,p,when,dur,dest,vel=90,ov){if(ov){I=Object.assign({},I,ov);if(ov.amax!==undefined)I.a=Math.min(I.a,ov.amax);if(ov.amul)I.a*=ov.amul}

function eff(i){const so=T.some(t=>t.solo);return(so?T[i].solo:!T[i].mute)?T[i].vol:0}

  chains=T.map((t,i)=>{const g=ac.createGain(),pn=ac.createStereoPanner();g.gain.value=eff(i);pn.pan.value=INST[i].pan;const ex=ac.createGain();g.ex=ex;g.connect(ex);ex.connect(pn);pn.connect(session);return g});

    t.notes.forEach(n=>{const x=expand(n);for(let k=0;k<x.length;k++)if(x[k].s+x[k].d>from+1e-6)queue.push({i,e:x[k]})});

  rx.fillStyle=panel;rx.fillRect(sl,0,vwr,RULER);rx.font='11px system-ui';rx.textBaseline='middle';

/* ---------- MIDI import ---------- */
function parseMidi(buf){
  const u=new Uint8Array(buf),d=new DataView(buf);let p=0;
  const s4=()=>{const r=String.fromCharCode(u[p],u[p+1],u[p+2],u[p+3]);p+=4;return r};
  if(u.length<14||s4()!=='MThd')throw new Error('not a MIDI file');
  const hl=d.getUint32(p);p+=4;const nt=d.getUint16(p+2),div=d.getUint16(p+4);p+=hl;
  if(div&0x8000)throw new Error('SMPTE timing isn’t supported');
  const src={},ccs={};let tempo=null;
  for(let t=0;t<nt&&p+8<=u.length;t++){
    if(s4()!=='MTrk'){break}
    const len=d.getUint32(p);p+=4;const end=Math.min(p+len,u.length);
    const vl=()=>{let v=0,b;do{b=u[p++];v=(v<<7)|(b&127)}while(b&128&&p<end);return v};
    let tick=0,run=0,name='';const prog={},open={},vels={};
    while(p<end){
      tick+=vl();let st=u[p];if(st<128)st=run;else{p++;if(st<0xF0)run=st}
      if(st===0xFF){const ty=u[p++],l=vl();if(ty===3&&!name)name=new TextDecoder().decode(u.subarray(p,p+l)).trim();if(ty===0x51&&tempo===null&&l===3)tempo=Math.round(6e7/((u[p]<<16)|(u[p+1]<<8)|u[p+2]));p+=l}
      else if(st===0xF0||st===0xF7){p+=vl()}
      else{
        const ty=st&0xF0,ch=st&15,a=u[p++],b=(ty===0xC0||ty===0xD0)?0:u[p++];
        if(ty===0xC0&&prog[ch]===undefined)prog[ch]=a;
        else if(ty===0x90&&b>0){const k=ch+':'+a;if(open[k]!==undefined)close(k,tick);open[k]=tick;vels[k]=b}
        else if(ty===0x80||(ty===0x90&&b===0))close(ch+':'+a,tick);
        else if(ty===0xB0&&(a===11||a===1)){const key=t+':'+ch,C=ccs[key]=ccs[key]||{},arr=C[a]=C[a]||[];if(!arr.length||arr[arr.length-1][1]!==b)arr.push([Math.round(tick/div*1000)/1000,b])}
      }
    }
    function close(k,at){const st0=open[k];if(st0===undefined)return;delete open[k];const ch=+k.split(':')[0],pt=+k.split(':')[1],key=t+':'+ch;
      const e=src[key]||(src[key]={key,name:'',ch,prog:0,notes:[],lo:127,hi:0,_t:name});
      e.notes.push({p:pt,s:st0/div,d:Math.max(.0625,(at-st0)/div),v:vels[k]||90});e.lo=Math.min(e.lo,pt);e.hi=Math.max(e.hi,pt);e.name=name;e.prog=prog[ch]!==undefined?prog[ch]:0}
    for(const k in open)close(k,tick);
  }
  const list=Object.values(src).filter(e=>e.notes.length);
  list.forEach(e=>{if(!e.name)e.name='Channel '+(e.ch+1);e.cc=ccs[e.key]||null});
  return{src:list,tempo:tempo?Math.max(40,Math.min(220,tempo)):null};
}

function doImport(m,ch,replace,useTempo){
  if(!ch.some(c=>c!=='skip'))return toast('Every part is set to Skip');
  pushUndo();const fresh={},by={};
  m.src.forEach((s,j)=>{const c=ch[j];if(c==='skip')return;let ti;
    if(c[0]==='t')ti=+c.slice(1);else{addTrackRaw(c.slice(1));ti=T.length-1}
    (by[ti]=by[ti]||[]).push(s)});
  let maxEnd=0,count=0,first=null;
  for(const ti in by){
    const[lo,hi]=INST[ti].r;if(first===null)first=+ti;if(replace){T[ti].notes=[];T[ti].cc={}}
    by[ti].forEach(s=>{
      const ps=s.notes.map(n=>n.p).sort((a,b)=>a-b),med=ps[ps.length>>1];
      const sh=(med<lo||med>hi)?Math.round(((lo+hi)/2-med)/12)*12:0;
      s.notes.forEach(n=>{let q=n.p+sh;while(q<lo)q+=12;while(q>hi)q-=12;const st=Math.round(n.s*1000)/1000,du=Math.round(n.d*1000)/1000;T[ti].notes.push({p:q,s:st,d:du,v:n.v||90});maxEnd=Math.max(maxEnd,st+du);count++});if(s.cc)for(const c in s.cc){const o=T[ti].cc=T[ti].cc||{};o[c]=(o[c]||[]).concat(s.cc[c]).sort((x,y)=>x[0]-y[0])}});
  }
  const need=Math.ceil(maxEnd/4),opts=BARS;
  if(need>P.bars)P.bars=opts.find(o=>o>=need)||256;
  const tot=P.bars*4;
  for(const ti in by)T[ti].notes=T[ti].notes.filter(n=>n.s<tot).map(n=>({p:n.p,s:n.s,d:Math.min(n.d,tot-n.s)}));
  if(useTempo&&m.tempo)P.tempo=m.tempo;
  $('bars').value=P.bars;$('tempo').value=P.tempo;sync();buildSide();selectTrack(first);save();closeModal();
  toast('Imported '+count+' notes'+(maxEnd>tot?' (the end was cut off at '+P.bars+' bars)':''));
}

let lane='vel',laneOn=true,lp=null;

const HINTS={vel:'Drag across the stems to set velocity — affects selected notes, or all notes if none are selected',11:'Draw an expression curve (CC11): plays back and exports',1:'Draw a dynamics / mod-wheel curve (CC1): exports only, many sample libraries use it for dynamics'};
const vOfY=y=>Math.max(lane==='vel'?1:0,Math.min(127,Math.round(127*(1-(y-6)/(LH-12)))));
const yOfV=v=>6+(LH-12)*(1-v/127);
function drawLane(){
  if(!laneOn||!INST[cur])return;
  const sl=$('sc').scrollLeft,vw=$('lanew').clientWidth,bw=P.bw,vwr=vw-KW;if(vwr<=0)return;
  fit(lc,lx,vw,LH);
  const line=css('--line'),line2=css('--line2'),ink=css('--ink'),acc=css('--acc'),mute=css('--mute'),panel=css('--panel'),col=INST[cur].c;
  lx.fillStyle=css('--bg');lx.fillRect(0,0,vw,LH);
  lx.save();lx.translate(KW-sl,0);lx.beginPath();lx.rect(sl,0,vwr,LH);lx.clip();lx.lineWidth=1;
  const b0=Math.max(0,Math.floor(sl/bw)),b1=Math.min(total(),Math.ceil((sl+vwr)/bw));
  for(let b=b0;b<=b1;b++){const x=Math.round(b*bw)+.5;lx.strokeStyle=b%4===0?line2:line;lx.beginPath();lx.moveTo(x,0);lx.lineTo(x,LH);lx.stroke()}
  [.25,.5,.75].forEach(q=>{const y=Math.round(6+(LH-12)*q)+.5;lx.strokeStyle=line;lx.beginPath();lx.moveTo(sl,y);lx.lineTo(sl+vwr,y);lx.stroke()});
  let empty=false;
  if(lane==='vel'){
    T[cur].notes.forEach(n=>{const x=n.s*bw;if(x<sl-8||x>sl+vwr+8)return;const y=yOfV(n.v||90);lx.strokeStyle=col;lx.lineWidth=2;lx.beginPath();lx.moveTo(x,LH-6);lx.lineTo(x,y);lx.stroke();
      lx.fillStyle=col;lx.beginPath();lx.arc(x,y,5,0,7);lx.fill();if(sel.has(n)){lx.strokeStyle=ink;lx.lineWidth=2;lx.stroke()}});
  }else{
    const arr=(T[cur].cc||{})[lane];empty=!arr||!arr.length;
    if(!empty){lx.strokeStyle=col;lx.fillStyle=col;lx.lineWidth=2;lx.beginPath();lx.moveTo(arr[0][0]*bw,yOfV(arr[0][1]));arr.forEach(q=>lx.lineTo(q[0]*bw,yOfV(q[1])));lx.stroke();
      lx.globalAlpha=.15;lx.lineTo(arr[arr.length-1][0]*bw,LH-6);lx.lineTo(arr[0][0]*bw,LH-6);lx.closePath();lx.fill();lx.globalAlpha=1}
  }

  lx.fillStyle=panel;lx.fillRect(0,0,KW,LH);lx.fillStyle=mute;lx.font='11px system-ui';lx.fillText(lane==='vel'?'Vel':'CC'+lane,6,LH/2);
  lx.strokeStyle=line2;lx.lineWidth=1;lx.beginPath();lx.moveTo(KW-.5,0);lx.lineTo(KW-.5,LH);lx.stroke();
}
function paintLane(x0,y0,x1,y1){
  const bw=P.bw,a=Math.min(x0,x1),b=Math.max(x0,x1),vAt=x=>vOfY(x1===x0?y1:y0+(y1-y0)*Math.max(0,Math.min(1,(x-x0)/(x1-x0))));

  else{const t=T[cur];t.cc=t.cc||{};const arr=t.cc[lane]=t.cc[lane]||[],st=Math.max(.125,Math.min(P.grid,.5));
    for(let bt=Math.floor(a/bw/st)*st;bt<=b/bw+1e-6;bt+=st){if(bt<0||bt>total())continue;const v=vAt(Math.max(a,Math.min(b,bt*bw))),k=arr.findIndex(q=>Math.abs(q[0]-bt)<st/2);if(k>=0)arr[k]=[bt,v];else arr.push([bt,v])}

$('strBtn').onclick=structDialog;

/* ---------- backup / restore ---------- */
const expErr=err=>{const c=err&&err.code,m=err&&err.message||'';toast(c==='declined'||/cancel|dismiss/i.test(m)?'Cancelled':c==='host_unavailable'?'This app can’t save files—open the page in Chrome instead':'Failed: '+(m||'unknown error'))};
async function exportProjects(ids,fname){
  saveNow();const projects=ids.map(id=>{const m=idx.list.find(x=>x.id===id),q=id===curId?{P,T}:rd(PK+id);return q&&m?{name:m.name,P:q.P,T:q.T}:null}).filter(Boolean);
  if(!projects.length)return toast('Nothing to export');
  const data=new TextEncoder().encode(JSON.stringify({app:'orchestral-sketchpad',version:2,projects}));
  try{const r=await saveFiles([{name:fname,data}],fname,true);toast(r==='shared'?'Choose where to save the backup':'Backup saved')}catch(err){expErr(err)}
}
const hex=c=>typeof c==='string'&&/^#[0-9a-fA-F]{6}$/.test(c)?c:undefined;
function cleanT(a){
  if(!Array.isArray(a))return null;const num=(x,d)=>isFinite(+x)?+x:d;
  const r=a.filter(t=>t&&CATK[t.k]&&Array.isArray(t.notes)).map(t=>{const cc={};
    if(t.cc&&typeof t.cc==='object')for(const c of ['1','11'])if(Array.isArray(t.cc[c]))cc[c]=t.cc[c].filter(q=>Array.isArray(q)&&isFinite(q[0])&&isFinite(q[1])).map(q=>[+q[0],Math.max(0,Math.min(127,+q[1]))]);
    return{k:t.k,nm:typeof t.nm==='string'?t.nm.slice(0,40):undefined,col:hex(t.col),grp:FAMS.includes(t.grp)?t.grp:undefined,cc,vol:Math.max(0,Math.min(1,num(t.vol,.8))),mute:!!t.mute,solo:!!t.solo,
      notes:t.notes.filter(n=>n&&isFinite(n.p)&&isFinite(n.s)&&isFinite(n.d)).map(n=>({p:+n.p,s:+n.s,d:Math.max(.0625,+n.d),v:isFinite(n.v)?Math.max(1,Math.min(127,+n.v)):undefined,a:(ART[n.a]&&n.a!=='n')?n.a:undefined}))}});
  return r.length?r:null;
}
$('rfile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=JSON.parse(await f.text()),ps=j&&j.projects;if(!Array.isArray(ps)||!ps.length)throw new Error('no projects found in the file');let n=0;
    ps.forEach(p=>{const t=cleanT(p&&p.T);if(!t)return;const q=p.P||{},id=uid(),num=(x,d)=>isFinite(+x)?+x:d;
      const PP={tempo:Math.max(40,Math.min(220,num(q.tempo,90))),bars:BARS.includes(+q.bars)?+q.bars:8,grid:[4,2,1,.5,.25,.125,.0625].includes(+q.grid)?+q.grid:.5,bw:Math.max(10,Math.min(160,num(q.bw,40))),q:q.q?1:0,
        mk:Array.isArray(q.mk)?q.mk.filter(m=>m&&isFinite(m.b)).map(m=>({b:+m.b,n:String(m.n||'').slice(0,24)})):[],tc:Array.isArray(q.tc)?q.tc.filter(c=>c&&isFinite(c.b)&&c.bpm>=20&&c.bpm<=300).map(c=>({b:+c.b,bpm:+c.bpm})):[],gc:{}};
      if(wr(PK+id,{P:PP,T:t})){idx.list.push({id,name:String(p.name||'Restored').slice(0,60),mod:Date.now()});n++}});
    saveIdx();renderMenu();toast('Restored '+n+' project'+(n===1?'':'s'))}
  catch(err){toast('Couldn’t restore: '+err.message)}};

/* ---------- articulations ---------- */
const ART={n:{s:'',n:'Normal'},stac:{s:'·',n:'Staccato'},stcc:{s:'▾',n:'Staccatissimo'},ten:{s:'–',n:'Tenuto'},port:{s:'–·',n:'Portato'},acc:{s:'>',n:'Accent'},marc:{s:'^',n:'Marcato'},sfz:{s:'sfz',n:'Sforzando'},slur:{s:'⌒',n:'Legato / slur'},tr:{s:'tr',n:'Trill (whole step)'},trh:{s:'tr½',n:'Trill (half step)'},mord:{s:'mord',n:'Mordent'},trem:{s:'≡',n:'Tremolo'},pizz:{s:'pizz',n:'Pizzicato'}};
let curArt='n';
function expand(n){
  const a=n.a,v0=n.v||90,p=n.p,s=n.s,d=n.d,cv=x=>Math.max(1,Math.min(127,Math.round(x)));
  const one=(dd,vv,ov)=>[{p,s,d:Math.max(.06,dd),v:cv(vv),ov}];
  const rep=(delta,step,ov)=>{const cnt=Math.min(1000,Math.floor(d/step));if(cnt<2)return one(d,v0);const r=[];
    for(let k=0;k<cnt;k++){const st=s+k*step;r.push({p:delta&&k%2?p+delta:p,s:st,d:k===cnt-1?s+d-st:step*.92,v:cv(v0),ov})}return r};
  switch(a){
    case 'stac':return one(Math.min(d*.5,.75),v0,{amax:.02,rl:.08});
    case 'stcc':return one(Math.min(d*.25,.4),v0+5,{amax:.015,rl:.05});
    case 'ten':return one(d+.02,v0+6);
    case 'port':return one(d*.75,v0+4,{amax:.04,rl:.1});
    case 'acc':return one(d*.9,v0+20,{amax:.012});
    case 'marc':return one(d*.7,v0+26,{amax:.01,rl:.1});
    case 'sfz':return one(d*.9,v0+34,{amax:.008});
    case 'slur':return one(d+.07,v0-4,{amul:2.5});
    case 'pizz':return one(Math.min(d*.4,.6),v0,{amax:.005,dec:.28,rl:.06,vib:0,nz:0});
    case 'tr':return rep(2,.125,{amax:.01,vib:0});
    case 'trh':return rep(1,.125,{amax:.01,vib:0});
    case 'trem':return rep(0,.125,{amax:.01});
    case 'mord':if(d<.25)return one(d,v0);return[{p,s,d:.0625,v:cv(v0)},{p:p+2,s:s+.0625,d:.0625,v:cv(v0)},{p,s:s+.125,d:d-.125,v:cv(v0)}];
    default:return one(d,v0);
  }
}
(()=>{const as=$('artSel');Object.entries(ART).forEach(([k,a])=>{const o=document.createElement('option');o.value=k;o.textContent=(a.s?a.s+'  ':'')+a.n;as.append(o)});
  const mx=document.createElement('option');mx.value='mixed';mx.textContent='Mixed';mx.hidden=true;as.append(mx);
  as.onchange=()=>{const v=as.value;if(v==='mixed')return;curArt=v;if(sel.size){pushUndo();sel.forEach(n=>{if(v==='n')delete n.a;else n.a=v});draw();save()}}})();
function updArt(){const as=$('artSel');if(!as)return;if(sel.size){const set=new Set([...sel].map(x=>x.a||'n'));as.value=set.size===1?[...set][0]:'mixed'}else as.value=curArt}
$('qsel').onchange=e=>{P.q=e.target.value==='q'?1:0;Q=P.q?2:1;save();draw()};

/* ---------- voice to MIDI ---------- */
let rec=null;
function detectPitch(buf,sr){
  const W=1024,tauMax=Math.min(Math.floor(sr/70),buf.length-W-2),tauMin=Math.max(2,Math.floor(sr/1100));
  let e=0;for(let i=0;i<W;i++)e+=buf[i]*buf[i];const rms=Math.sqrt(e/W);if(rms<.012)return{rms,f:0};
  const d=new Float32Array(tauMax+2);let run=0;d[0]=1;
  for(let tau=1;tau<=tauMax;tau++){let sum=0;for(let i=0;i<W;i++){const x=buf[i]-buf[i+tau];sum+=x*x}run+=sum;d[tau]=run?sum*tau/run:1}
  let tau=-1;for(let t=tauMin;t<tauMax;t++){if(d[t]<.15){while(t+1<tauMax&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0)return{rms,f:0};
  const a=d[tau-1],b=d[tau],c=d[tau+1],den=a-2*b+c,sh=den?.5*(a-c)/den:0;
  return{rms,f:sr/(tau+sh)};
}
function voiceDialog(){openModal('Voice → MIDI',bx=>{
  const p=document.createElement('p');p.style.cssText='color:var(--mute);margin:0 0 8px';
  p.textContent='Sing or hum one note at a time. It records onto “'+INST[cur].n+'”, starting at the start marker (bar '+(Math.floor(startBeat/4)+1)+'). Quiet room, phone or tablet mic close to you works best.';bx.append(p);
  const mk=(t,on)=>{const lb=document.createElement('label');lb.style.cssText='display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px;color:var(--ink)';const c=document.createElement('input');c.type='checkbox';c.checked=on;lb.append(c,t);bx.append(lb);return c};
  const cnt=mk('Count-in (one bar of clicks)',true),pl=mk('Play the arrangement while recording (use headphones)',false),qz=mk('Snap notes to the grid afterwards',true);
  const row=(t,el)=>{const r=document.createElement('div');r.style.cssText='display:flex;gap:8px;align-items:center;margin:8px 0';const l=document.createElement('span');l.textContent=t;l.style.flex='1';r.append(l,el);bx.append(r)};
  const oc=document.createElement('select');[-2,-1,0,1,2].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=(v>0?'+':'')+v+' octave'+(Math.abs(v)===1?'':'s');if(v===0)o.selected=true;oc.append(o)});row('Shift the result by',oc);
  const lat=document.createElement('input');lat.type='number';lat.min=0;lat.max=400;lat.style.width='80px';let lv='80';try{lv=localStorage.getItem('orch-lat')||'80'}catch(e){}lat.value=lv;row('Mic latency compensation (ms)',lat);
  const bar=document.createElement('div');bar.className='ca';bar.style.marginTop='14px';
  const go=document.createElement('button');go.className='pri';go.textContent='● Start recording';const no=document.createElement('button');no.textContent='Cancel';no.onclick=closeModal;
  go.onclick=()=>{try{localStorage.setItem('orch-lat',lat.value)}catch(e){}const o={count:cnt.checked,play:pl.checked,quant:qz.checked,oct:+oc.value,lat:Math.max(0,+lat.value||0)};closeModal();startRec(o)};
  bar.append(go,no);bx.append(bar);
})}
async function startRec(o){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)return toast('Microphone access isn’t available here');
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})}catch(e){return toast('Microphone permission was denied')}
  initAudio();try{await ac.resume()}catch(e){}
  const an=ac.createAnalyser();an.fftSize=2048;const src=ac.createMediaStreamSource(stream);src.connect(an);
  const R={stream,src,an,buf:new Float32Array(2048),frames:[],o,track:cur,from:startBeat};
  startPlay(startBeat,!o.play,o.count?4*60/P.tempo:0);
  rec=R;$('rec').hidden=false;$('recn').textContent=o.count?'Count-in…':'Listening…';R.timer=setInterval(recFrame,30);
}
function recFrame(){
  if(!rec||!playing)return;
  rec.an.getFloatTimeDomainData(rec.buf);
  const el=ac.currentTime-t0+B0,b=s2b(segs,Math.max(0,el-rec.o.lat/1000));
  if(el<B0-.02){$('recn').textContent='Count-in…';return}
  const pd=detectPitch(rec.buf,ac.sampleRate),m=pd.f?69+12*Math.log2(pd.f/440):null;
  rec.frames.push({b,m,r:pd.rms});
  if(m===null)$('recn').textContent='● Listening…';
  else{const rn=Math.round(m),c=Math.round((m-rn)*100);$('recn').textContent='● '+pname(Math.max(0,Math.min(127,rn)))+'  '+(c>=0?'+':'')+c+'¢'}
}
function segmentVoice(R){
  const F=R.frames;if(F.length<4)return[];
  const dt=(F[F.length-1].b-F[0].b)/(F.length-1)||.05,med=a=>{const t=a.slice().sort((x,y)=>x-y);return t[t.length>>1]};
  const M=F.map((f,i)=>{if(f.m===null)return null;const w=[F[i-1],f,F[i+1]].filter(x=>x&&x.m!==null).map(x=>x.m);return med(w)});
  const done=[];let cu=null,gap=0,pend=[];
  const close=e=>{if(cu){cu.e=e;done.push(cu);cu=null}};
  for(let i=0;i<F.length;i++){const m=M[i],f=F[i];
    if(m===null){if(cu){gap++;pend=[];if(gap>=4)close(cu.last+dt)}continue}
    gap=0;
    if(!cu){cu={s:f.b,ms:[m],rs:[f.r],last:f.b};pend=[];continue}
    if(Math.abs(m-med(cu.ms))>.8){pend.push({m,f});if(pend.length>=3){close(pend[0].f.b);cu={s:pend[0].f.b,ms:pend.map(x=>x.m),rs:pend.map(x=>x.f.r),last:pend[pend.length-1].f.b};pend=[]}}
    else{pend=[];cu.ms.push(m);cu.rs.push(f.r);cu.last=f.b}}
  if(cu)close(cu.last+dt);
  const[lo,hi]=INST[R.track].r;
  let ns=done.filter(c=>c.ms.length>=3).map(c=>{let p=Math.round(med(c.ms)*Q)/Q+12*R.o.oct;while(p<lo)p+=12;while(p>hi)p-=12;
    const rm=c.rs.reduce((x,y)=>x+y,0)/c.rs.length;return{p,s:c.s,d:Math.max(dt,c.e-c.s),v:Math.round(40+80*Math.min(1,Math.max(0,(rm-.012)/.15)))}});
  if(R.o.quant){const g=P.grid;ns.forEach(n=>{n.s=Math.max(0,Math.round(n.s/g)*g);n.d=Math.max(g,Math.round(n.d/g)*g)})}
  ns.sort((a,b)=>a.s-b.s);const res=[];
  ns.forEach(n=>{const pv=res[res.length-1];if(pv&&n.s<pv.s+pv.d-1e-6){if(n.s<=pv.s+1e-6)return;pv.d=n.s-pv.s}res.push(n)});
  return res;
}
function finishRec(){
  const R=rec;rec=null;clearInterval(R.timer);try{R.src.disconnect()}catch(e){}R.stream.getTracks().forEach(t=>t.stop());$('rec').hidden=true;
  if(!T[R.track])return;
  const ns=segmentVoice(R);if(!ns.length)return toast('No clear notes were detected—try singing louder or closer to the mic');
  pushUndo();const tr=T[R.track];let mx=0;ns.forEach(n=>{tr.notes.push(n);mx=Math.max(mx,n.s+n.d)});
  const need=Math.ceil(mx/4);if(need>P.bars){P.bars=BARS.find(o=>o>=need)||256;$('bars').value=P.bars}
  if(cur===R.track){sel=new Set(ns);updSel()}draw();save();toast('Recorded '+ns.length+' notes');
}
$('vbtn').onclick=voiceDialog;$('recstop').onclick=()=>stopPlay();

/* ---------- init ---------- */
setTool('draw');setLane('vel');boot();showMenu();
</script>
