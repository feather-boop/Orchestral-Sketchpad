name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach the APK to a GitHub Release when you push a v* tag

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Optional signing secrets. If they are not set, only the debug APK is built.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare the preinstalled Android SDK
        # GitHub's ubuntu runners already ship the Android SDK (ANDROID_HOME is set),
        # so we only accept licenses and make sure the platform Capacitor 8 needs is present.
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" || echo "Could not pre-install platform 36; Gradle will try to download it."

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Add the Android platform (skipped if an android/ folder is committed)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Add microphone permission (needed for Voice to MIDI)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          add = ''
          for perm in ('android.permission.RECORD_AUDIO', 'android.permission.MODIFY_AUDIO_SETTINGS'):
              if perm not in s:
                  add += '    <uses-permission android:name="%s" />\n' % perm
          if 'android.hardware.microphone' not in s:
              add += '    <uses-feature android:name="android.hardware.microphone" android:required="false" />\n'
          if add:
              s = s.replace('</manifest>', add + '</manifest>')
              open(p, 'w', encoding='utf-8').write(s)
          print('Manifest ready')
          PY

      - name: Generate app icons
        if: hashFiles('assets/icon-only.png') != ''
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#5a1f17' --iconBackgroundColorDark '#2a0f12'

      - name: Copy web app into the Android project
        run: npx cap sync android

      - name: Set version (versionCode = run number)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect debug APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/OrchestralSketchpad-debug.apk

      - name: Build and sign release APK (only if signing secrets are set)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          set -e
          (cd android && ./gradlew assembleRelease --no-daemon --stacktrace)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out dist/OrchestralSketchpad-release.apk "$RUNNER_TEMP/aligned.apk"
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Upload APK(s)
        uses: actions/upload-artifact@v4
        with:
          name: OrchestralSketchpad-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK(s) to the GitHub Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
